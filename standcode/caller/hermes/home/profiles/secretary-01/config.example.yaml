model:
  provider: kimi_direct
  default: k3
agent:
  max_turns: 40
  image_input_mode: native
  api_max_retries: 6
display:
  tool_progress: all
  background_process_notifications: error
platform_toolsets:
  weixin:
  - terminal
skills:
  external_dirs:
  - <HOME>/.qclaw-hermes/skills-router
_config_version: 33
compression:
  threshold: 0.1
tool_output:
  max_bytes: 16000
  max_lines: 500
session_reset:
  mode: daily
  at_hour: 4
onboarding:
  seen:
    openclaw_residue_cleanup: true
    busy_input_prompt: true
    tool_progress_prompt: true
    profile_build_offered: true
terminal:
  cwd: <HOME>/.qclaw-hermes/workspace
memory:
  provider: holographic
approvals:
  mode: false
  destructive_slash_confirm: false
